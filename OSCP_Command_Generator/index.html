<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OSCP Command Generator v1.2.7</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Command Builder</h2>

      <label for="category">Category</label>
      <select id="category">
        <option value="">Select category</option>
      </select>

      <button id="loadBtn">Load Commands</button>
      <button id="resetBtn">Reset</button>

      <label for="search">Search Commands</label>
      <input type="text" id="search" placeholder="Type to search commands..." />

      <label for="target">Target IP (IPv4)</label>
      <input type="text" id="target" placeholder="e.g. 192.168.1.10" />

      <label for="target6">Target IP (IPv6)</label>
      <input
        type="text"
        id="target6"
        placeholder="e.g. fe80::1ff:fe23:4567:890a"
      />

      <label for="targetPort">Target Port</label>
      <input
        type="number"
        id="targetPort"
        placeholder="1–65535"
        min="1"
        max="65535"
      />

      <label for="kali">Kali IP (IPv4)</label>
      <input type="text" id="kali" placeholder="e.g. 10.0.0.5" />

      <label for="kali6">Kali IP (IPv6)</label>
      <input
        type="text"
        id="kali6"
        placeholder="e.g. fe80::1ff:fe23:abcd:1234"
      />

      <label for="kaliPort">Kali Port</label>
      <input
        type="number"
        id="kaliPort"
        placeholder="1–65535"
        min="1"
        max="65535"
      />

      <label for="user">Username</label>
      <input type="text" id="user" placeholder="e.g. admin" />

      <label for="password">Password</label>
      <input type="text" id="password" placeholder="e.g. P@ssw0rd" />

      <label for="domain">Domain</label>
      <input type="text" id="domain" placeholder="e.g. example.com" />

      <label for="dcIp">Domain Controller IP</label>
      <input type="text" id="dcIp" placeholder="e.g. 192.168.1.1" />

      <label for="ntlm">NTLM Hash</label>
      <input
        type="text"
        id="ntlm"
        placeholder="e.g. 11223344556677889900aabbccddeeff"
      />

      <label for="filename1">Filename 1</label>
      <input type="text" id="filename1" placeholder="e.g. secret.txt" />

      <label for="filename2">Filename 2</label>
      <input type="text" id="filename2" placeholder="e.g. output.txt" />

      <label for="wordlist1">Wordlist 1</label>
      <input
        type="text"
        id="wordlist1"
        placeholder="/usr/share/wordlists/rockyou.txt"
      />

      <label for="wordlist2">Wordlist 2</label>
      <input
        type="text"
        id="wordlist2"
        placeholder="/usr/share/wordlists/other.txt"
      />
    </div>

    <!-- Main Content -->
    <div class="main">
      <h2>Generated Commands</h2>
      <div id="commands"></div>
    </div>

    <!-- Help Button and Popup -->
    <button id="helpBtn" class="help-btn">?</button>
    <div id="helpPopup" class="help-popup" aria-hidden="true"></div>

    <script>
      let currentCategory = "";

      const tagMap = {
        "<target>": "Target IPv4",
        "<target6>": "Target IPv6",
        "<port>": "Target Port",
        "<kali>": "Kali IPv4",
        "<kali6>": "Kali IPv6",
        "<kaliPort>": "Kali Port",
        "<user>": "Username",
        "<password>": "Password",
        "<domain>": "Domain",
        "<dc-ip>": "Domain Controller IP",
        "<ntlm>": "NTLM Hash",
        "<filename1>": "Filename 1",
        "<filename2>": "Filename 2",
        "<wordlist1>": "Wordlist 1",
        "<wordlist2>": "Wordlist 2",
      };

      // ===== Utilities =====
      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function isValidIPv4(ip) {
        return /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.|$)){4}$/.test(ip);
      }
      function isValidIPv6(ip) {
        return /^(([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4})$/.test(ip);
      }
      function isValidPort(port) {
        return /^\d+$/.test(port) && port >= 1 && port <= 65535;
      }

      function showError(input, msg) {
        input.classList.add("input-error");
        input.title = msg;
      }
      function clearError(input) {
        input.classList.remove("input-error");
        input.title = "";
      }

      function validateField(input) {
        const id = input.id;
        const val = input.value.trim();
        if (!val) {
          clearError(input);
          return true;
        }

        let valid = true;
        if (
          (id === "target" || id === "kali" || id === "dcIp") &&
          !isValidIPv4(val)
        ) {
          valid = false;
          showError(input, "Invalid IPv4 address");
        }
        if ((id === "target6" || id === "kali6") && !isValidIPv6(val)) {
          valid = false;
          showError(input, "Invalid IPv6 address");
        }
        if ((id === "targetPort" || id === "kaliPort") && !isValidPort(val)) {
          valid = false;
          showError(input, "Port must be 1–65535");
        }
        if (valid) clearError(input);
        return valid;
      }

      function validateAllInputs() {
        const ids = [
          "target",
          "target6",
          "targetPort",
          "kali",
          "kali6",
          "kaliPort",
          "dcIp",
        ];
        let valid = true;
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el && !validateField(el)) valid = false;
        });
        if (!valid)
          alert(
            "⚠️ Some fields are invalid. Hover over red fields for details."
          );
        return valid;
      }

      // ===== Input Restrictions + Ctrl+C / Ctrl+V support =====
      function enableIPField(input, type) {
        input.addEventListener("keydown", (e) => {
          if (e.ctrlKey && (e.key === "c" || e.key === "v")) return; // allow copy/paste
          const allowed = [
            "Backspace",
            "ArrowLeft",
            "ArrowRight",
            "Delete",
            "Tab",
          ];
          if (allowed.includes(e.key)) return;

          if (type === "ipv4") {
            if (!/[0-9.]/.test(e.key)) {
              e.preventDefault();
              return;
            }
            const caret = input.selectionStart;
            const next =
              input.value.slice(0, caret) + e.key + input.value.slice(caret);
            const parts = next.split(".");
            if (
              parts.length > 4 ||
              parts.some(
                (p) =>
                  p.length > 3 ||
                  (p.length > 1 && p.startsWith("0")) ||
                  (p !== "" && Number(p) > 255)
              )
            )
              e.preventDefault();
            if (
              e.key === "." &&
              (caret === 0 ||
                input.value[caret - 1] === "." ||
                input.value[caret] === ".")
            )
              e.preventDefault();
          } else if (type === "ipv6") {
            if (!/[0-9a-fA-F:]/.test(e.key)) e.preventDefault();
          }
        });
      }

      ["target", "kali", "dcIp"].forEach((id) =>
        enableIPField(document.getElementById(id), "ipv4")
      );
      ["target6", "kali6"].forEach((id) =>
        enableIPField(document.getElementById(id), "ipv6")
      );

      ["targetPort", "kaliPort"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("keydown", (e) => {
          if (
            !/[0-9]/.test(e.key) &&
            !["Backspace", "ArrowLeft", "ArrowRight", "Delete", "Tab"].includes(
              e.key
            )
          )
            e.preventDefault();
          const c = el.selectionStart;
          const p = el.value.slice(0, c) + e.key + el.value.slice(c);
          if (Number(p) > 65535) e.preventDefault();
        });
        el.addEventListener("input", () => {
          const val = el.value.trim();
          if (!val || (Number(val) >= 1 && Number(val) <= 65535))
            clearError(el);
          else showError(el, "Port must be 1–65535");
        });
      });

      // ===== Apply Variables =====
      function applyVars(cmd) {
        const map = {
          "<target>": document.getElementById("target")?.value || "",
          "<target6>": document.getElementById("target6")?.value || "",
          "<port>": document.getElementById("targetPort")?.value || "",
          "<kali>": document.getElementById("kali")?.value || "",
          "<kali6>": document.getElementById("kali6")?.value || "",
          "<kaliPort>": document.getElementById("kaliPort")?.value || "",
          "<user>": document.getElementById("user")?.value || "",
          "<password>": document.getElementById("password")?.value || "",
          "<domain>": document.getElementById("domain")?.value || "",
          "<dc-ip>": document.getElementById("dcIp")?.value || "",
          "<ntlm>": document.getElementById("ntlm")?.value || "",
          "<filename1>": document.getElementById("filename1")?.value || "",
          "<filename2>": document.getElementById("filename2")?.value || "",
          "<wordlist1>": document.getElementById("wordlist1")?.value || "",
          "<wordlist2>": document.getElementById("wordlist2")?.value || "",
        };
        let result = cmd;
        Object.entries(map).forEach(
          ([tag, val]) => (result = result.split(tag).join(val || tag))
        );
        return result;
      }

      // ===== Smart Fetch =====
      async function smartFetch(url) {
        try {
          const cacheKey = `cache_${url}`;
          const etagKey = `etag_${url}`;
          const oldEtag = localStorage.getItem(etagKey);
          const headers = oldEtag ? { "If-None-Match": oldEtag } : {};
          const res = await fetch(url, { headers });
          if (res.status === 304 && localStorage.getItem(cacheKey))
            return localStorage.getItem(cacheKey);
          if (!res.ok)
            throw new Error(`Failed to fetch ${url} (${res.status})`);
          const text = await res.text();
          const newEtag =
            res.headers.get("ETag") ||
            res.headers.get("Last-Modified") ||
            Date.now();
          localStorage.setItem(cacheKey, text);
          localStorage.setItem(etagKey, newEtag);
          return text;
        } catch (err) {
          console.error("smartFetch error:", err);
          throw err;
        }
      }

      // ===== Load Categories (directory listing) =====
      async function loadCategories(preserveValue = "") {
        try {
          const text = await smartFetch("data/");
          const files = [...text.matchAll(/href="([^"]+\.txt)"/g)].map(
            (m) => m[1]
          );
          const names = files.map((f) => f.replace(".txt", ""));
          const select = document.getElementById("category");
          select.innerHTML = '<option value="">Select category</option>';
          names.forEach((name) => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            select.appendChild(opt);
          });
          if (preserveValue) select.value = preserveValue;
        } catch (err) {
          console.error("loadCategories error:", err);
          const select = document.getElementById("category");
          select.innerHTML =
            '<option value="miscellaneous">miscellaneous</option>';
        }
      }

      // ===== Load & Render Commands =====
      async function loadCommands(cat) {
        const file = "data/" + cat + ".txt";
        try {
          const text = await smartFetch(file);
          const rawLines = text
            .split(/\r?\n/)
            .map((l) => l.replace(/\r/g, ""))
            .filter((l) => l.trim() !== "");
          const parsed = [];
          for (let raw of rawLines) {
            let line = raw.trim();
            let priority = false;
            if (line.startsWith("^")) {
              priority = true;
              line = line.slice(1).trim();
            }
            const idx = line.indexOf(":");
            const title = idx === -1 ? "Command" : line.slice(0, idx).trim();
            const cmd = idx === -1 ? line : line.slice(idx + 1).trim();
            parsed.push({ title, cmd, priority });
          }
          const merged = [];
          for (const item of parsed) {
            if (
              merged.length &&
              merged[merged.length - 1].title === item.title
            ) {
              merged[merged.length - 1].cmd += " ;\n" + item.cmd;
              merged[merged.length - 1].priority =
                merged[merged.length - 1].priority || item.priority;
            } else merged.push({ ...item });
          }
          const priorityEntries = merged
            .filter((e) => e.priority)
            .sort((a, b) =>
              a.title.toLowerCase().localeCompare(b.title.toLowerCase())
            );
          const normalEntries = merged.filter((e) => !e.priority);
          return [...priorityEntries, ...normalEntries];
        } catch (err) {
          console.error("loadCommands error:", err);
          return [];
        }
      }

      async function renderCommands(selectedCategory = "") {
        const selectEl = document.getElementById("category");
        const cat =
          selectedCategory && selectedCategory !== ""
            ? selectedCategory
            : selectEl.value;
        const container = document.getElementById("commands");
        if (!cat) {
          container.innerHTML = "<p>Select a category.</p>";
          currentCategory = "";
          return;
        }
        if (!validateAllInputs()) return;
        container.innerHTML = "<p>Loading...</p>";
        try {
          const commands = await loadCommands(cat);
          const search = document.getElementById("search").value.toLowerCase();
          const filtered = commands.filter(
            (c) =>
              c.title.toLowerCase().includes(search) ||
              c.cmd.toLowerCase().includes(search)
          );
          container.innerHTML = "";
          if (!filtered.length) {
            container.innerHTML = "<p>No commands found.</p>";
            currentCategory = cat;
            return;
          }
          filtered.forEach((c) => {
            const card = document.createElement("div");
            card.className =
              "command-block" + (c.priority ? " top-priority" : "");
            const title = document.createElement("div");
            title.innerHTML = "<strong>" + escapeHtml(c.title) + "</strong>";
            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.type = "button";
            btn.textContent = "Copy";
            const pre = document.createElement("pre");
            pre.dataset.template = c.cmd;
            pre.textContent = applyVars(c.cmd);
            card.appendChild(title);
            card.appendChild(btn);
            card.appendChild(pre);
            container.appendChild(card);
          });
          attachCopyHandlers();
          currentCategory = cat;
        } catch (err) {
          console.error("renderCommands error:", err);
          container.innerHTML =
            "<p>Error loading commands. See console for details.</p>";
        }
      }

      function attachCopyHandlers() {
        document.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.onclick = async () => {
            try {
              const pre = btn.parentElement.querySelector("pre");
              const text = pre ? pre.textContent : "";
              await navigator.clipboard.writeText(text);
              const original = btn.textContent;
              btn.textContent = "Copied!";
              setTimeout(() => (btn.textContent = original), 1200);
            } catch (err) {
              console.error("clipboard error", err);
              alert("Failed to copy to clipboard");
            }
          };
        });
      }

      // ===== Live Updates =====
      function enableLiveUpdates() {
        Object.keys(tagMap).forEach((tag) => {
          const map = {
            "<target>": "target",
            "<target6>": "target6",
            "<port>": "targetPort",
            "<kali>": "kali",
            "<kali6>": "kali6",
            "<kaliPort>": "kaliPort",
            "<user>": "user",
            "<password>": "password",
            "<domain>": "domain",
            "<dc-ip>": "dcIp",
            "<ntlm>": "ntlm",
            "<filename1>": "filename1",
            "<filename2>": "filename2",
            "<wordlist1>": "wordlist1",
            "<wordlist2>": "wordlist2",
          };
          const id = map[tag];
          if (!id) return;
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener("input", () => {
            validateField(el);
            const catNow = document.getElementById("category").value;
            if (!currentCategory || catNow !== currentCategory) return;
            document
              .querySelectorAll(".command-block pre")
              .forEach(
                (pre) => (pre.textContent = applyVars(pre.dataset.template))
              );
          });
        });
        document
          .getElementById("search")
          .addEventListener("input", () => renderCommands(currentCategory));
      }

      // ===== Help Popup =====
      (function populateHelp() {
        const helpPopup = document.getElementById("helpPopup");
        try {
          const rows = Object.entries(tagMap)
            .map(
              ([tag, desc]) =>
                `<tr><td><code>${escapeHtml(tag)}</code></td><td>${escapeHtml(
                  desc
                )}</td></tr>`
            )
            .join("");
          helpPopup.innerHTML = `<table><thead><tr><th>Tag</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
          helpPopup.style.display = "none";
          helpPopup.setAttribute("aria-hidden", "true");
        } catch (err) {
          console.error("populateHelp error", err);
          helpPopup.textContent = "Help data unavailable";
        }
      })();

      function toggleHelp() {
        const helpPopup = document.getElementById("helpPopup");
        const btn = document.getElementById("helpBtn");
        if (helpPopup.style.display === "block") {
          helpPopup.style.display = "none";
          helpPopup.setAttribute("aria-hidden", "true");
          btn.setAttribute("aria-expanded", "false");
        } else {
          helpPopup.style.display = "block";
          helpPopup.setAttribute("aria-hidden", "false");
          btn.setAttribute("aria-expanded", "true");
        }
      }
      document.getElementById("helpBtn").addEventListener("click", toggleHelp);
      document
        .getElementById("helpPopup")
        .addEventListener("click", toggleHelp);

      // ===== Event Listeners =====
      document.getElementById("loadBtn").addEventListener("click", async () => {
        const searchInput = document.getElementById("search");
        searchInput.value = "";
        searchInput.focus();
        const selected =
          document.getElementById("category").value || currentCategory;
        try {
          await loadCategories(selected);
        } catch (e) {
          console.warn(
            "loadCategories on button click failed, continuing to render with current selection"
          );
        }
        await renderCommands(selected);
      });

      document.getElementById("category").addEventListener("change", () => {
        document.getElementById("commands").innerHTML = "";
        currentCategory = "";
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        document
          .querySelectorAll(".sidebar input")
          .forEach((i) => (i.value = ""));
        document
          .querySelectorAll(".input-error")
          .forEach((i) => i.classList.remove("input-error"));
        document.getElementById("commands").innerHTML = "";
        currentCategory = "";
      });

      // ===== Init =====
      (async function init() {
        try {
          await loadCategories();
        } catch (e) {
          console.warn("init: loadCategories failed", e);
        }
        enableLiveUpdates();
      })();
    </script>
  </body>
</html>
