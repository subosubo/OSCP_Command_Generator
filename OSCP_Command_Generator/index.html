<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSCP Command Generator v1.2.5</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>Command Builder</h2>

      <label for="category">Category</label>
      <select id="category">
        <option value="">Select category</option>
      </select>

      <label for="search">Search Commands</label>
      <input type="text" id="search" placeholder="Type to search commands..." />

      <label for="target">Target IP (IPv4)</label>
      <input type="text" id="target" placeholder="e.g. 192.168.1.10" />

      <label for="target6">Target IP (IPv6)</label>
      <input
        type="text"
        id="target6"
        placeholder="e.g. fe80::1ff:fe23:4567:890a"
      />

      <label for="targetPort">Target Port</label>
      <input
        type="number"
        id="targetPort"
        placeholder="1–65535"
        min="1"
        max="65535"
      />

      <label for="kali">Kali IP (IPv4)</label>
      <input type="text" id="kali" placeholder="e.g. 10.0.0.5" />

      <label for="kali6">Kali IP (IPv6)</label>
      <input
        type="text"
        id="kali6"
        placeholder="e.g. fe80::1ff:fe23:abcd:1234"
      />

      <label for="kaliPort">Kali Port</label>
      <input
        type="number"
        id="kaliPort"
        placeholder="1–65535"
        min="1"
        max="65535"
      />

      <label for="user">Username</label>
      <input type="text" id="user" placeholder="e.g. admin" />

      <label for="password">Password</label>
      <input type="text" id="password" placeholder="e.g. P@ssw0rd" />

      <label for="domain">Domain</label>
      <input type="text" id="domain" placeholder="e.g. example.com" />

      <label for="dcIp">Domain Controller IP</label>
      <input type="text" id="dcIp" placeholder="e.g. 192.168.1.1" />

      <label for="ntlm">NTLM Hash</label>
      <input
        type="text"
        id="ntlm"
        placeholder="e.g. 11223344556677889900aabbccddeeff"
      />

      <label for="filename1">Filename</label>
      <input type="text" id="filename1" placeholder="e.g. secret.txt" />

      <label for="filename2">Filename</label>
      <input type="text" id="filename2" placeholder="e.g. output.txt" />

      <label for="wordlist1">Wordlist 1</label>
      <input
        type="text"
        id="wordlist1"
        placeholder="/usr/share/wordlists/rockyou.txt"
      />

      <label for="wordlist2">Wordlist 2</label>
      <input
        type="text"
        id="wordlist2"
        placeholder="/usr/share/wordlists/other.txt"
      />

      <button id="loadBtn">Load Commands</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="main">
      <h2>Generated Commands</h2>
      <div id="commands"></div>
    </div>

    <button id="helpBtn" class="help-btn">?</button>
    <div id="helpPopup" class="help-popup"></div>

    <script>
      let currentCategory = "";
      const tagMap = {
        target: "<target>",
        target6: "<target6>",
        targetPort: "<port>",
        kali: "<kali>",
        kali6: "<kali6>",
        kaliPort: "<kaliPort>",
        user: "<user>",
        password: "<password>",
        domain: "<domain>",
        filename1: "<filename1>",
        filename2: "<filename2>",
        wordlist1: "<wordlist1>",
        wordlist2: "<wordlist2>",
        dcIp: "<dc-ip>",
        ntlm: "<ntlm>",
      };

      // ===== Validation =====
      function isValidIPv4(ip) {
        return /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.|$)){4}$/.test(ip);
      }
      function isValidIPv6(ip) {
        return /^(([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4})$/.test(ip);
      }
      function isValidPort(port) {
        return /^\d+$/.test(port) && port >= 1 && port <= 65535;
      }
      function showError(input, msg) {
        input.classList.add("input-error");
        input.title = msg;
      }
      function clearError(input) {
        input.classList.remove("input-error");
        input.title = "";
      }
      function validateField(input) {
        const id = input.id,
          val = input.value.trim();
        if (!val) {
          clearError(input);
          return true;
        }
        let valid = true;
        if (
          (id === "target" || id === "kali" || id === "dcIp") &&
          !isValidIPv4(val)
        ) {
          valid = false;
          showError(input, "Invalid IPv4 address");
        }
        if ((id === "target6" || id === "kali6") && !isValidIPv6(val)) {
          valid = false;
          showError(input, "Invalid IPv6 address");
        }
        if ((id === "targetPort" || id === "kaliPort") && !isValidPort(val)) {
          valid = false;
          showError(input, "Port must be 1–65535");
        }
        if (valid) clearError(input);
        return valid;
      }
      function validateAllInputs() {
        let valid = true;
        [
          "target",
          "target6",
          "targetPort",
          "kali",
          "kali6",
          "kaliPort",
          "dcIp",
        ].forEach((id) => {
          const input = document.getElementById(id);
          if (!validateField(input)) valid = false;
        });
        if (!valid)
          alert(
            "⚠️ Some fields are invalid. Hover over red fields for details."
          );
        return valid;
      }

      // ===== Input Restrictions =====
      function restrictIPv4Input(e) {
        const input = e.target;
        const allowed = [
          "Backspace",
          "ArrowLeft",
          "ArrowRight",
          "Delete",
          "Tab",
        ];
        if (allowed.includes(e.key)) return;
        if (!/[0-9.]/.test(e.key)) {
          e.preventDefault();
          return;
        }

        const caret = input.selectionStart;
        const next =
          input.value.slice(0, caret) + e.key + input.value.slice(caret);
        const parts = next.split(".");
        if (parts.length > 4) {
          e.preventDefault();
          return;
        }
        for (const p of parts) {
          if (p === "") continue;
          if (p.length > 1 && p.startsWith("0")) {
            e.preventDefault();
            return;
          }
          if (p.length > 3) {
            e.preventDefault();
            return;
          }
          if (/^\d+$/.test(p) && Number(p) > 255) {
            e.preventDefault();
            return;
          }
        }
        if (
          e.key === "." &&
          (caret === 0 ||
            input.value[caret - 1] === "." ||
            input.value[caret] === ".")
        )
          e.preventDefault();
      }
      ["target", "kali", "dcIp"].forEach((id) =>
        document
          .getElementById(id)
          .addEventListener("keydown", restrictIPv4Input)
      );
      ["target6", "kali6"].forEach((id) =>
        document.getElementById(id).addEventListener("keydown", (e) => {
          const allowed = /[0-9a-fA-F:]/;
          if (
            !allowed.test(e.key) &&
            !["Backspace", "ArrowLeft", "ArrowRight", "Delete", "Tab"].includes(
              e.key
            )
          )
            e.preventDefault();
        })
      );
      ["targetPort", "kaliPort"].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener("keydown", (e) => {
          if (
            !/[0-9]/.test(e.key) &&
            !["Backspace", "ArrowLeft", "ArrowRight", "Delete", "Tab"].includes(
              e.key
            )
          ) {
            e.preventDefault();
            return;
          }
          const c = el.selectionStart,
            p = el.value.slice(0, c) + e.key + el.value.slice(c);
          if (Number(p) > 65535) e.preventDefault();
        });
        el.addEventListener("input", () => {
          const val = el.value.trim();
          if (!val || (Number(val) >= 1 && Number(val) <= 65535))
            clearError(el);
          else showError(el, "Port must be 1–65535");
        });
      });

      // ===== Apply Variables =====
      function applyVars(cmd) {
        let result = cmd;
        for (const [id, tag] of Object.entries(tagMap)) {
          const el = document.getElementById(id);
          if (!el) continue;
          result = result.replaceAll(tag, el.value || tag);
        }
        return result;
      }

      // ===== Fetch with Caching =====
      async function smartFetch(url) {
        try {
          const cacheKey = `cache_${url}`,
            etagKey = `etag_${url}`;
          const oldEtag = localStorage.getItem(etagKey);
          const headers = oldEtag ? { "If-None-Match": oldEtag } : {};
          const res = await fetch(url, { headers });
          if (res.status === 304 && localStorage.getItem(cacheKey))
            return localStorage.getItem(cacheKey);
          if (!res.ok) throw new Error(`Failed to fetch ${url}`);
          const text = await res.text();
          const newEtag =
            res.headers.get("ETag") ||
            res.headers.get("Last-Modified") ||
            Date.now();
          localStorage.setItem(cacheKey, text);
          localStorage.setItem(etagKey, newEtag);
          return text;
        } catch (err) {
          console.error(err);
          return "";
        }
      }

      // ===== Load Categories =====
      async function loadCategories(selected = "") {
        try {
          const text = await smartFetch("data/");
          const files = [...text.matchAll(/href="([^"]+\.txt)"/g)].map(
            (m) => m[1]
          );
          const names = files.map((f) => f.replace(".txt", ""));
          const select = document.getElementById("category");
          select.innerHTML = '<option value="">Select category</option>';
          names.forEach((n) => {
            const opt = document.createElement("option");
            opt.value = n;
            opt.textContent = n;
            select.appendChild(opt);
          });
          if (selected) select.value = selected;
        } catch (err) {
          console.error(err);
          document.getElementById("category").innerHTML =
            '<option value="miscellaneous">miscellaneous</option>';
        }
      }

      // ===== Load Commands =====
      async function loadCommands(cat) {
        const file = "data/" + cat + ".txt";
        try {
          const text = await smartFetch(file);
          const raw = text.split(/\r?\n/);
          const entries = [];
          for (let line of raw) {
            line = line.trim();
            if (!line) continue;
            const idx = line.indexOf(":");
            const title = idx === -1 ? "Command" : line.slice(0, idx).trim();
            const cmd = idx === -1 ? line : line.slice(idx + 1).trim();
            if (entries.length && entries[entries.length - 1].title === title)
              entries[entries.length - 1].cmd += " ;\n" + cmd;
            else entries.push({ title, cmd });
          }
          return entries;
        } catch (e) {
          console.error(e);
          return [];
        }
      }

      // ===== Render Commands =====
      async function renderCommands(selectedCategory = "") {
        const cat =
          document.getElementById("category").value || selectedCategory;
        const container = document.getElementById("commands");
        if (!cat) {
          container.innerHTML = "<p>Select a category.</p>";
          currentCategory = "";
          return;
        }
        if (!validateAllInputs()) return;
        container.innerHTML = "<p>Loading...</p>";
        const commands = await loadCommands(cat);
        const search = document.getElementById("search").value.toLowerCase();
        const filtered = commands.filter(
          (c) =>
            c.title.toLowerCase().includes(search) ||
            c.cmd.toLowerCase().includes(search)
        );
        container.innerHTML = "";
        if (!filtered.length) {
          container.innerHTML = "<p>No commands found.</p>";
          currentCategory = cat;
          return;
        }
        filtered.forEach((c) => {
          const card = document.createElement("div");
          card.className = "command-block";
          const title = document.createElement("div");
          title.innerHTML = "<strong>" + c.title + "</strong>";
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.textContent = "Copy";
          btn.onclick = () => {
            navigator.clipboard.writeText(applyVars(c.cmd));
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1200);
          };
          const pre = document.createElement("pre");
          pre.dataset.template = c.cmd;
          pre.textContent = applyVars(c.cmd);
          card.appendChild(title);
          card.appendChild(btn);
          card.appendChild(pre);
          container.appendChild(card);
        });
        currentCategory = cat;
      }

      // ===== Live Updates =====
      function enableLiveUpdates() {
        Object.keys(tagMap).forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.oninput = () => {
            validateField(el);
            const catNow = document.getElementById("category").value;
            if (!currentCategory || catNow !== currentCategory) return;
            document
              .querySelectorAll(".command-block pre")
              .forEach(
                (pre) => (pre.textContent = applyVars(pre.dataset.template))
              );
          };
        });
        document.getElementById("search").oninput = () =>
          renderCommands(currentCategory);
      }

      // ===== Help Popup =====
      const helpBtn = document.getElementById("helpBtn");
      const helpPopup = document.getElementById("helpPopup");

      helpPopup.innerHTML = Object.entries(tagMap)
        .map(([id, tag]) => {
          const safeTag = tag.replace(/</g, "&lt;").replace(/>/g, "&gt;");
          return `<div><strong>${id}</strong>: <code>${safeTag}</code></div>`;
        })
        .join("");
      helpPopup.style.display = "none";

      function toggleHelp() {
        if (helpPopup.style.display === "block") {
          helpPopup.style.height = "0";
          setTimeout(() => (helpPopup.style.display = "none"), 300);
        } else {
          helpPopup.style.display = "block";
          helpPopup.style.height = "auto";
        }
      }
      helpBtn.onclick = toggleHelp;
      helpPopup.onclick = toggleHelp;

      // ===== Event Listeners =====
      document.getElementById("loadBtn").addEventListener("click", async () => {
        const search = document.getElementById("search");
        search.value = "";
        search.focus();
        const selectedCategory =
          document.getElementById("category").value || currentCategory;
        await loadCategories(selectedCategory);
        renderCommands(selectedCategory);
      });

      document.getElementById("category").addEventListener("change", () => {
        document.getElementById("commands").innerHTML = "";
        currentCategory = "";
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        document
          .querySelectorAll(".sidebar input")
          .forEach((i) => (i.value = ""));
        document.getElementById("commands").innerHTML = "";
        currentCategory = "";
      });

      // ===== Init =====
      loadCategories();
      enableLiveUpdates();
    </script>
  </body>
</html>
